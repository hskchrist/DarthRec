# Reach8 - configuración. Se puede editar con el juego cerrado o desde el menú (F8).
# Ubicación al usarse: Documentos\Reach8\reach8.ini
[general]
activado = 1
# 1 a 4 jugadores en ESTA ventana del juego. Cambiar antes de iniciar la misión.
jugadores_locales = 1
# Código de tecla virtual de Windows (0x77 = F8)
tecla_menu = 0x77
bloquear_juego_con_menu = 1

[jugador1]
nombre = Jugador 1
# km (solo jugador 1), auto, o pad:<clave> (se asigna desde el menú)
dispositivo = km

[jugador2]
nombre = Jugador 2
dispositivo = auto

[jugador3]
nombre = Jugador 3
dispositivo = auto

[jugador4]
nombre = Jugador 4
dispositivo = auto

[reach]
# Parches conocidos de haloreach.dll (solo se aplican si se reconoce la versión).
parches = 1
# Parches propios para versiones nuevas de MCC, separados por ';'
# Formato: rva_hex:bytes_hex:comprobación  (comprobación = inicio_funcion | salto_corto | ninguna)
# Ejemplo: 0x397354:31C0C390:inicio_funcion;0x394A2C:EB:salto_corto
parches_propios =

[identidad]
# Base para los identificadores (XUID) de los jugadores extra. Se genera sola.
semilla_xuid =

[ventana]
# none, full, left, right, top, bottom (para 2 instancias: left y right)
disposicion = none
monitor = 0

[mandos]
windows_gaming_input = 1
hidapi = 1
rawinput = 0

[investigacion]
# Cuenta (sin guardar contenido) los paquetes de red que el motor envía por MCC.
netprobe = 0
