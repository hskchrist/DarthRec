name: Compilar Reach8 (Windows)

on:
  push:
    paths:
      - "halo-reach-8p/**"
      - ".github/workflows/reach8.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: halo-reach-8p
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (CMake + MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar Release
        run: cmake --build build --config Release --parallel

      - name: Verificar el DLL (exportaciones y descripción)
        shell: pwsh
        run: |
          $dll = "build/Release/WTSAPI32.dll"
          $desc = (Get-Item $dll).VersionInfo.FileDescription
          if ($desc -notlike "*Reach8*") { throw "Falta la descripción Reach8 (la usa uninstall.ps1): '$desc'" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $exports = & $dumpbin.FullName /exports $dll | Out-String
          foreach ($name in "WTSQuerySessionInformationW", "WTSRegisterSessionNotification", "WTSFreeMemory") {
            if ($exports -notmatch "$name\s*\(forwarded to") { throw "Exportación $name no reenviada" }
          }
          $count = ([regex]::Matches($exports, "forwarded to")).Count
          Write-Host "Descripción: $desc | Exportaciones reenviadas a Windows: $count"

      - name: Comprobar herramienta de análisis
        run: python -I tools/r8scan.py --self-test

      - name: Empaquetar
        shell: pwsh
        run: |
          $out = "dist/Reach8"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/Release/WTSAPI32.dll $out/
          Copy-Item config/reach8.ini $out/
          Copy-Item tools/install.ps1, tools/uninstall.ps1, tools/r8scan.py $out/
          Copy-Item README.md $out/LEEME.md
          Copy-Item docs -Recurse $out/docs

      - uses: actions/upload-artifact@v4
        with:
          name: Reach8-windows-x64
          path: halo-reach-8p/dist/Reach8
